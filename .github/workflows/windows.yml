name: Arquivos do Windows

# Confere os arquivos da instalação do Windows num Windows de verdade e empacota para o pendrive
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# O Windows não aceita pasta terminando em ponto (nome do repositório): o projeto vai para C:\projeto
defaults:
  run:
    shell: powershell
    working-directory: C:\

jobs:
  conferir:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        run: git clone --depth 1 -b "${{ github.ref_name }}" "https://github.com/${{ github.repository }}" C:\projeto

      - name: Conferir o script e o autounattend.xml
        run: |
          $script = 'C:\projeto\windows\pendrive\leve\pos-instalacao.ps1'
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$erros) | Out-Null
          if ($erros) { $erros | ForEach-Object { Write-Error $_ }; exit 1 }
          [xml](Get-Content -Raw C:\projeto\windows\pendrive\autounattend.xml) | Out-Null
          if ([IO.File]::ReadAllBytes($script)[0] -ne 0xEF) { Write-Error "pos-instalacao.ps1 precisa de UTF-8 com BOM"; exit 1 }
          Write-Host "Tudo certo"

      - name: Empacotar para o pendrive
        uses: actions/upload-artifact@v4
        with:
          name: arquivos-pendrive-windows
          path: C:\projeto\windows\pendrive\
          retention-days: 90
