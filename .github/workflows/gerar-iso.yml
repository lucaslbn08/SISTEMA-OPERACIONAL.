name: Gerar ISO

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: gerar-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Gerar ISO (Debian 13 + KDE Plasma)
        run: |
          docker run --rm --privileged -v "$PWD:/build" -w /build debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y live-build curl ca-certificates
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub -o config/archives/google-chrome.key.chroot
            cp config/archives/google-chrome.key.chroot config/archives/google-chrome.key.binary
            lb clean --purge
            lb config
            lb build
            for iso in *.iso; do sha256sum "$iso" > "$iso.sha256"; done
            chown -R '"$(id -u):$(id -g)"' .
          '
          ls -lh *.iso

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            *.iso
            *.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Guardar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: build.log
          retention-days: 7
