name: Gerar ISO

# O pendrive é gerado de novo quando muda a montagem dele; as mudanças do sistema (pasta pacote/)
# chegam a quem já instalou pelo workflow "Publicar atualização", sem precisar de um pendrive novo
on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "auto/**"
      - ".github/workflows/gerar-iso.yml"
  workflow_dispatch:

concurrency:
  group: gerar-iso
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
          mkdir -p "$RUNNER_TEMP/relatorio"

      - name: Montar o pacote do sistema (e publicar no canal de atualizações)
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE_ATUALIZACOES: ${{ secrets.CHAVE_ATUALIZACOES }}
        run: |
          sudo apt-get install -y -qq apt-utils > /dev/null
          scripts/ci-pacote.sh "$RUNNER_TEMP/pacote"
          mkdir -p config/packages.chroot
          cp "$RUNNER_TEMP"/pacote/*.deb config/packages.chroot/

      - name: Gerar ISO (Debian 13 + KDE Plasma)
        run: |
          docker run --rm --privileged -v "$PWD:/build" -w /build debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y live-build curl ca-certificates
            # Confere se todos os pacotes existem antes de começar a montagem
            sed -i "s/^Components: main$/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            dependencias=$(sed -n "s/^Depends: //p" pacote/DEBIAN/control | tr "," "\n" | awk "{print \$1}")
            faltando=$( { grep -hvE "^\s*(#|$)" config/package-lists/desktop.list.chroot; echo "$dependencias"; } | while read -r p; do apt-cache show "$p" > /dev/null 2>&1 || echo "$p"; done)
            if [ -n "$faltando" ]; then echo "PACOTES NÃO ENCONTRADOS:" $faltando; exit 1; fi
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub -o config/archives/google-chrome.key.chroot
            cp config/archives/google-chrome.key.chroot config/archives/google-chrome.key.binary
            lb clean --purge
            lb config
            lb build
            for iso in *.iso; do sha256sum "$iso" > "$iso.sha256"; done
            chown -R '"$(id -u):$(id -g)"' .
          ' 2>&1 | tee "$RUNNER_TEMP/relatorio/gerar.log"
          ls -lh *.iso | tee "$RUNNER_TEMP/relatorio/iso.txt"

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            *.iso
            *.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Testar em máquina virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf socat imagemagick > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          testes/testar-vm.sh "$(ls *.iso | head -1)" "$RUNNER_TEMP/relatorio/telas"

      - name: Salvar relatório no branch "relatorio"
        if: always()
        run: |
          r="$RUNNER_TEMP/relatorio"
          [ -f build.log ] && tail -n 5000 build.log > "$r/build-final.log"
          [ -d config/bootloaders ] && cp -r config/bootloaders "$r/" || true
          [ -f "$r/gerar.log" ] && tail -n 3000 "$r/gerar.log" > "$r/gerar-final.log" && rm "$r/gerar.log"
          echo "${{ job.status }} $(date -u +%FT%TZ) ${{ github.sha }}" > "$r/status.txt"
          cd "$r"
          git init -q -b relatorio
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Relatório do build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" relatorio
